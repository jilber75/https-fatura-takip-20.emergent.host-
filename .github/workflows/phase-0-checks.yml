name: Phase 0 checks
on:
  push:
    branches: [feature/phase-0-security-backups]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/phase-0-checks.yml"]
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install isolated backup test dependencies
        run: pip install 'cryptography>=42.0.8' 'pytest>=8.0.0' 'pymongo==4.6.3' 'motor==3.3.1' 'fastapi==0.110.1' 'python-multipart>=0.0.9' 'python-dotenv>=1.0.1' 'bcrypt==4.1.3' 'pyjwt>=2.10.1' 'requests>=2.31.0'
      - name: Test backup cryptography and archive validation
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: finanspulse_test
          JWT_SECRET: test-only-ci-value
        run: cd backend && pytest -q tests/test_backups.py
