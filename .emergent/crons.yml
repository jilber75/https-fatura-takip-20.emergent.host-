crons:
  - name: due-reminders
    description: "Her sabah 09:00 (İstanbul) vadesi yaklaşan ödeme ve tahsilatlar için e-posta hatırlatması gönderir"
    cron: "0 9 * * *"
    timezone: "Europe/Istanbul"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/due-reminders"
    method: POST
    enabled: true
